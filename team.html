  <!-- Stylesheet -->
  <style>
/* ==== SHARED:BASE-CSS START ==== */
/* Design Tokens, Reset, Typography Defaults */
/* ==========================================================================
   ALODANAX TECHFEST - CINEMATIC PRODUCTION STYLESHEET
   Strict Palette: Black (#000000 / #05060A), Surface (#0B0D14),
   Electric Blue (#0A84FF), Neon Red (#FF1744), White (#FFFFFF / rgba(255,255,255,0.7))
   All vendor prefixes, clip-path glows, form controls, and viewports optimized.
   ========================================================================== */

:root {
  --black: #000000;
  --page-bg: #05060A;
  --surface: #0B0D14;
  --surface-alt: #10131E;
  --surface-border: rgba(10, 132, 255, 0.2);
  --blue: #0A84FF;
  --blue-bright: #409CFF; /* WCAG AA accessible on black */
  --blue-glow: rgba(10, 132, 255, 0.45);
  --blue-glow: rgba(10, 132, 255, 0.5);
  --neon-red: #FF1744;
  --neon-red-bright: #FF4D6D; /* WCAG AA accessible on black */
  --neon-red-glow: rgba(255, 23, 68, 0.55);
  --white: #FFFFFF;
  --text-primary: rgba(255, 255, 255, 0.94);
  --text-secondary: rgba(255, 255, 255, 0.78);
  --text-tertiary: #8A94A6;
  --white-muted: rgba(255, 255, 255, 0.78);
  --white-dim: #8A94A6;
  --white-blue: #D6ECFF;
  
  /* Dynamic accent driven by ScrollTrigger */
  --accent: #FF1744;

  /* Typography */
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  /* Spacing & Motion */
  --container-max: 1280px;
  --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-sharp: cubic-bezier(0.25, 1, 0.5, 1);
}

/* Global Typography Defaults */
body {
  font-family: var(--font-body);
  font-size: 1.0625rem; /* 17px desktop */
  line-height: 1.65;
  color: var(--text-primary);
  background-color: var(--black);
}

@media (max-width: 768px) {
  body {
    font-size: 1rem; /* 16px mobile */
  }
}

p {
  max-width: 68ch;
  line-height: 1.65;
  color: var(--text-secondary);
}

/* Base Reset & Box Sizing */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-family: var(--font-body);
  background-color: var(--black);
  color: var(--text-primary);
  line-height: 1.65;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: auto;
}

/* Lenis Recommended Compatibility Styles */
html.lenis, html.lenis body {
  height: auto;
}

.lenis.lenis-smooth {
  scroll-behavior: auto !important;
}

.lenis.lenis-smooth [data-lenis-prevent] {
  overscroll-behavior: contain;
}

.lenis.lenis-stopped {
  overflow: hidden;
}

body {
  background-color: var(--page-bg);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
}

/* Accessibility: Skip to Content */
.skip-link {
  position: absolute;
  top: -60px;
  left: 20px;
  background: var(--blue);
  color: var(--white);
  padding: 10px 18px;
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 600;
  text-decoration: none;
  z-index: 99999;
  border-radius: 2px;
  box-shadow: 0 0 20px var(--blue-glow);
  transition: top 0.2s ease;
}

.skip-link:focus {
  top: 20px;
  outline: 2px solid var(--white);
}

/* Focus states */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

/* Container Utility */
.section-container {
  width: 90%;
  max-width: var(--container-max);
  margin: 0 auto;
  position: relative;
}


/* Navigation Bar & Header */
/* ==========================================================================
   NAVIGATION BAR
   ========================================================================== */
#site-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  padding: 1.25rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  background: rgba(5, 6, 10, 0.78);
  border-bottom: 1px solid rgba(10, 132, 255, 0.15);
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.4s var(--ease-cinematic), opacity 0.4s ease;
}

#site-header.is-visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.nav-brand {
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.8vw, 1.35rem);
  font-weight: 800;
  letter-spacing: 0.2em;
  text-decoration: none;
  color: var(--white);
  background: linear-gradient(135deg, #FFFFFF 20%, #A0B2C6 60%, #FFFFFF 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
  flex-shrink: 0;
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 2rem;
  list-style: none;
}

.nav-link {
  font-family: var(--font-display);
  font-size: 0.875rem; /* 14px */
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  transition: color 0.2s ease;
  position: relative;
  display: inline-block;
  padding: 0.4rem 0.2rem;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0%;
  height: 1px;
  background: var(--blue);
  box-shadow: 0 0 8px var(--blue-glow);
  transition: width 0.3s var(--ease-cinematic);
}

.nav-link:hover {
  color: var(--white);
}

.nav-link:hover::after {
  width: 100%;
}

.nav-cta-btn {
  font-family: var(--font-display);
  font-size: 0.875rem; /* 14px */
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 0.55rem 1.25rem;
  min-height: 44px;
}

.nav-cta-btn:hover {
  background: var(--neon-red);
  box-shadow: 0 0 24px var(--neon-red-glow);
  transform: translateY(-1px);
}


/* Post-Hero Cinematic Design System: Buttons, Section Headers, Utilities */
/* ==========================================================================
   POST-HERO CINEMATIC DESIGN SYSTEM
   ========================================================================== */
.site-main {
  position: relative;
  z-index: 20;
  background-color: var(--page-bg);
}

.page-section {
  padding: 8rem 0;
  position: relative;
  border-bottom: 1px solid rgba(10, 132, 255, 0.08);
}

/* Section Header & Huge Display Headings */
.section-header-wrap {
  margin-bottom: 4rem;
}

.section-tag {
  font-family: var(--font-display);
  font-size: 0.8125rem; /* 13px */
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--blue-bright);
  text-transform: uppercase;
  margin-bottom: 0.75rem;
  display: block;
}

.display-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5.5vw, 4.25rem);
  font-weight: 800;
  letter-spacing: 0.06em;
  line-height: 1.05;
  text-transform: uppercase;
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1rem;
  align-items: baseline;
}

.title-solid {
  color: var(--white);
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.25);
}

.title-outline {
  color: var(--white);
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.85);
  letter-spacing: 0.08em;
  transition: -webkit-text-stroke 0.3s ease;
}

@supports (-webkit-text-stroke: 1px white) {
  .title-outline {
    color: transparent;
  }
}

.display-title:hover .title-outline {
  -webkit-text-stroke: 1.5px var(--blue);
}

.hairline-divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, var(--blue) 0%, rgba(10, 132, 255, 0.2) 60%, transparent 100%);
  margin-top: 1.8rem;
}

/* ScrollTrigger Reveals (Staggered fade/translate ≤0.8s) */
.reveal-item {
  opacity: 0;
  transform: translateY(32px);
  will-change: opacity, transform;
  transition: opacity 0.75s var(--ease-cinematic), transform 0.75s var(--ease-cinematic);
}

.reveal-item.is-revealed {
  opacity: 1;
  transform: translateY(0);
}


/* Shared Footer */
/* ==========================================================================
   5. FOOTER SECTION
   ========================================================================== */
.site-footer {
  background: #020306;
  border-top: 1px solid rgba(10, 132, 255, 0.18);
  padding: 5rem 0 2.5rem;
  position: relative;
  z-index: 25;
}

.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1.2fr;
  gap: 3.5rem;
  margin-bottom: 4rem;
}

.footer-brand {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  color: var(--white);
  text-decoration: none;
  display: inline-block;
  margin-bottom: 0.8rem;
  background: linear-gradient(135deg, #FFFFFF 0%, #A0B2C6 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.footer-department {
  font-family: var(--font-display);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--blue);
  margin-bottom: 0.4rem;
  text-transform: none;
}

.footer-tagline {
  font-size: 0.88rem;
  color: var(--white-muted);
}

.footer-col-title {
  font-family: var(--font-display);
  font-size: 0.875rem; /* 14px */
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--blue-bright);
  margin-bottom: 1.25rem;
  text-transform: none;
}

.footer-nav-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.footer-nav-list a {
  font-size: 0.875rem; /* 14px */
  color: var(--text-secondary);
  transition: color 0.2s ease;
  display: inline-block;
  padding: 0.25rem 0;
}

.footer-nav-list a:hover {
  color: var(--blue);
}

.footer-contact-line {
  font-size: 0.85rem;
  color: var(--white-muted);
  margin-bottom: 0.75rem;
  line-height: 1.6;
}

.footer-contact-line strong {
  color: var(--blue-bright);
  font-size: 0.8125rem; /* 13px */
  letter-spacing: 0.06em;
}

.social-pill {
  font-family: var(--font-display);
  font-size: 0.8125rem; /* 13px */
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 0.45rem 0.95rem;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 4px;
  transition: all 0.2s ease;
}

.footer-bottom-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 2rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.footer-copyright {
  font-size: 0.8125rem; /* 13px */
  color: var(--text-tertiary);
  letter-spacing: 0.02em;
}

.back-to-top {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-display);
  font-size: 0.8125rem; /* 13px */
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  min-height: 44px;
  padding: 0.35rem 0.75rem;
}

.back-to-top:hover {
  color: var(--blue);
  transform: translateY(-2px);
}


/* Multi-Page Navigation Enhancements & Mobile Drawer */
/* ==========================================================================
   ALODANAX MULTI-PAGE EXPANSION SUITE
   Shared Nav, Subpage Hero, Accessible Modal, Categories, Audit HUD
   ========================================================================== */

/* Shared Nav Enhancements */
.site-header.is-subpage-nav {
  opacity: 1 !important;
  pointer-events: auto !important;
  transform: none !important;
  background: rgba(5, 6, 10, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(10, 132, 255, 0.2);
}

.site-header.is-scrolled {
  background: rgba(5, 6, 10, 0.96) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--blue) !important;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(10, 132, 255, 0.15);
}

.nav-inner-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: var(--max-w);
  margin: 0 auto;
}

.nav-link.is-active {
  color: var(--white);
  border-bottom: 2px solid var(--blue);
  text-shadow: 0 0 8px var(--blue-glow);
}

/* Mobile Hamburger & Accessible Drawer */
.nav-hamburger {
  display: none;
  background: transparent;
  border: 1px solid rgba(10, 132, 255, 0.3);
  padding: 0.55rem 0.65rem;
  cursor: pointer;
  flex-direction: column;
  gap: 5px;
  border-radius: 2px;
  transition: border-color 0.2s ease, background 0.2s ease;
}

.nav-hamburger:hover, .nav-hamburger:focus-visible {
  border-color: var(--blue);
  background: rgba(10, 132, 255, 0.1);
  outline: 2px solid var(--blue);
}

.hamburger-line {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--white);
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.mobile-drawer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  visibility: hidden;
  pointer-events: none;
  transition: visibility 0.3s ease;
}

.mobile-drawer.is-open {
  visibility: visible;
  pointer-events: auto;
}

.drawer-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.mobile-drawer.is-open .drawer-backdrop {
  opacity: 1;
}

.drawer-panel {
  position: absolute;
  top: 0;
  right: 0;
  width: 82%;
  max-width: 340px;
  height: 100%;
  background: #0B0D14;
  border-left: 1px solid var(--blue);
  box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(10, 132, 255, 0.2);
  display: flex;
  flex-direction: column;
  padding: 1.5rem;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
}

.mobile-drawer.is-open .drawer-panel {
  transform: translateX(0);
}

.drawer-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid rgba(10, 132, 255, 0.2);
  margin-bottom: 1.5rem;
}

.drawer-brand {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  color: var(--white);
}

.drawer-close-btn {
  background: transparent;
  border: 1px solid rgba(255, 23, 68, 0.4);
  color: var(--neon-red);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.drawer-close-btn:hover, .drawer-close-btn:focus-visible {
  background: rgba(255, 23, 68, 0.15);
  border-color: var(--neon-red);
  outline: 2px solid var(--neon-red);
}

.drawer-links-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}

.drawer-link {
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--white-muted);
  display: block;
  padding: 0.4rem 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  transition: color 0.2s ease, padding-left 0.2s ease;
}

.drawer-link:hover, .drawer-link:focus-visible {
  color: var(--blue);
  padding-left: 0.4rem;
}

.drawer-link.is-active {
  color: var(--white);
  border-left: 3px solid var(--blue);
  padding-left: 0.6rem;
}

.drawer-footer-meta {
  margin-top: auto;
  padding-top: 2rem;
  font-size: 0.8125rem; /* 13px */
  color: var(--white-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}


/* Common Subpage Hero (~45vh) */
/* ==========================================================================
   COMMON SUBPAGE HERO (~45vh)
   ========================================================================== */
.subpage-hero-section {
  min-height: 44vh;
  position: relative;
  background: #000000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 6rem;
  padding-bottom: 3.5rem;
  overflow: hidden;
}

.subpage-hero-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 40%, rgba(10, 132, 255, 0.07) 0%, #000000 80%);
  pointer-events: none;
}

.subpage-hero-container {
  position: relative;
  z-index: 2;
}

.subpage-breadcrumb {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-display);
  font-size: 0.8125rem; /* 13px */
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: 1.5rem;
}

.disabled-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #FF9800;
  box-shadow: 0 0 6px #FF9800;
  display: inline-block;
}

/* Fallback Image Design */
.is-fallback-image {
  object-fit: cover;
  background: #0B0D14;
  border: 1px solid rgba(10, 132, 255, 0.25);
}


/* Category Color Coding & Badges */
/* ==========================================================================
   CATEGORY COLOR CODING & CARDS
   ========================================================================== */
.category-technical {
  --cat-accent: var(--blue);
  --cat-glow: var(--blue-glow);
}

.category-non-technical {
  --cat-accent: #FFFFFF;
  --cat-glow: rgba(255, 255, 255, 0.2);
}

.category-gaming {
  --cat-accent: var(--neon-red);
  --cat-glow: var(--neon-glow);
}

/* Category Pill Badges */
.category-badge {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 0.8125rem; /* 13px */
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.25rem 0.65rem;
  border-radius: 1px;
}

.category-badge.cat-technical {
  background: rgba(10, 132, 255, 0.12);
  border: 1px solid var(--blue);
  color: var(--blue);
}

.category-badge.cat-non-technical {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: var(--white);
}

.category-badge.cat-gaming {
  background: rgba(255, 23, 68, 0.12);
  border: 1px solid var(--neon-red);
  color: var(--neon-red);
}


/* Accessible Event Modal Dialog */
/* ==========================================================================
   ACCESSIBLE EVENT MODAL DIALOG
   ========================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal-overlay.is-active {
  opacity: 1;
  visibility: visible;
}

.modal-window {
  background: #0B0D14;
  border: 1px solid var(--blue);
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(10, 132, 255, 0.25);
  max-width: 820px;
  width: 100%;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transform: translateY(20px) scale(0.98);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-overlay.is-active .modal-window {
  transform: translateY(0) scale(1);
}

.modal-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.8rem;
  border-bottom: 1px solid rgba(10, 132, 255, 0.2);
  background: rgba(5, 6, 10, 0.95);
}

.modal-close-btn {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--white);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 2px;

  <script>
/* ==== SHARED:COMPONENTS START ==== */
// --- ALODANAX Utilities & Diagnostics ---
/**
 * ALODANAX TechFest - Core Utilities & Validation Suite
 * Handles placeholder detection, Google Form validation, safe link formatting,
 * image error fallbacks, and the ?audit=1 diagnostic engine.
 */

(function (window) {
  'use strict';

  /**
   * Check if a value is undefined, empty, or a bracketed placeholder like "[TBA]" or "[NAME]".
   * @param {*} val
   * @returns {boolean}
   */
  function isPlaceholder(val) {
    if (val === null || val === undefined) return true;
    if (typeof val !== 'string') return false;
    const trimmed = val.trim();
    if (trimmed === '') return true;
    return trimmed.startsWith('[') || trimmed.includes('[') && trimmed.includes(']');
  }

  /**
   * Safe text renderer: Returns subtle TBA badge if value is placeholder or empty.
   * @param {string} val
   * @param {string} fallbackLabel
   * @param {boolean} returnHtml
   * @returns {string}
   */
  function formatSafeText(val, fallbackLabel = 'TBA', returnHtml = true) {
    if (isPlaceholder(val)) {
      return returnHtml ? `<span class="badge-tba" aria-label="To be announced">${fallbackLabel}</span>` : fallbackLabel;
    }
    return val;
  }

  /**
   * Safe link generator: returns null if value is a placeholder.
   * Otherwise returns tel:, mailto:, or valid url.
   * @param {'tel'|'mailto'|'url'} type
   * @param {string} val
   * @returns {string|null}
   */
  function formatSafeLink(type, val) {
    if (isPlaceholder(val)) return null;
    const clean = val.trim();
    if (type === 'tel') return `tel:${clean.replace(/[^\d+]/g, '')}`;
    if (type === 'mailto') return `mailto:${clean}`;
    if (type === 'url') return clean.startsWith('http') ? clean : `https://${clean}`;
    return clean;
  }

  /**
   * Validates per-event Google Form URL according to strict festival requirements.
   * URL must:
   * 1. Start with https://
   * 2. Host must be docs.google.com (path /forms), forms.gle, or www.google.com (path /forms)
   * 3. Not be empty or start with "["
   *
   * @param {object} event
   * @returns {string|null} - Returns valid URL string or null if invalid/placeholder
   */
  function getEventRegistrationUrl(event) {
    if (!event || !event.registrationUrl) return null;
    const urlStr = event.registrationUrl.trim();
    if (isPlaceholder(urlStr)) return null;

    try {
      const parsed = new URL(urlStr);
      if (parsed.protocol !== 'https:') return null;

      const host = parsed.hostname.toLowerCase();
      const path = parsed.pathname.toLowerCase();

      if (host === 'forms.gle') return urlStr;
      if ((host === 'docs.google.com' || host === 'www.google.com') && path.startsWith('/forms')) {
        return urlStr;
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  /**
   * Renders registration CTA: active Google Form link or disabled "Registration Opening Soon" button.
   * @param {object} event
   * @param {object} options
   * @returns {string} HTML string
   */
  function renderRegistrationButton(event, options = {}) {
    const validUrl = getEventRegistrationUrl(event);
    const extraClass = options.className || 'btn-cta';
    const btnText = options.text || 'REGISTER NOW';

    if (validUrl) {
      return `<a href="${validUrl}" target="_blank" rel="noopener noreferrer" class="${extraClass} btn-primary-neon" aria-label="Register for ${event.name || 'Event'} via official Google Form">
        <span>${btnText}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>`;
    }

    return `<button type="button" class="${extraClass} btn-disabled" aria-disabled="true" tabindex="-1" title="Registration link is being finalized">
      <span class="disabled-status-dot" aria-hidden="true"></span>
      <span>Registration Opening Soon</span>
    </button>`;
  }

  /**
   * Verifies that no two different events share the exact same registration URL.
   * Logs console.error if duplicate URLs are found.
   * @param {Array} eventsList
   */
  function verifyUniqueRegistrationUrls(eventsList) {
    if (!Array.isArray(eventsList)) return;
    const seen = new Map();

    eventsList.forEach(ev => {
      const url = getEventRegistrationUrl(ev);
      if (url) {
        if (seen.has(url)) {
          console.error(
            `[ALODANAX REGISTRATION SECURITY]: Duplicate Google Form URL detected!\n` +
            `Event "${ev.name}" shares registration link with "${seen.get(url)}":\n${url}`
          );
        } else {
          seen.set(url, ev.name);
        }
      }
    });
  }

  /**
   * Designed SVG silhouette & initial fallback generator.
   * Produces an inline SVG data-uri with dark styling, electric blue hairline, and typography.
   * @param {'event'|'profile'|'team'|'logo'} type
   * @param {string} label
   * @returns {string}
   */
  function createFallbackSvg(type, label = 'ALODANAX') {
    const safeLabel = (label || 'AX').replace(/[<>&"]/g, '');
    let w = 800, h = 500, ratio = '16:10'; // Default event
    let iconSvg = '';

    if (type === 'profile') {
      w = 400; h = 500; ratio = '4:5';
      iconSvg = `
        <circle cx="200" cy="180" r="50" fill="#0E131F" stroke="#0A84FF" stroke-width="2"/>
        <path d="M120 310 C120 250, 280 250, 280 310 Z" fill="#0E131F" stroke="#0A84FF" stroke-width="2"/>
      `;
    } else if (type === 'team') {
      w = 400; h = 400; ratio = '1:1';
      iconSvg = `
        <circle cx="200" cy="150" r="45" fill="#0E131F" stroke="#0A84FF" stroke-width="2"/>
        <path d="M130 260 C130 210, 270 210, 270 260 Z" fill="#0E131F" stroke="#0A84FF" stroke-width="2"/>
      `;
    } else if (type === 'logo') {
      w = 300; h = 100; ratio = '3:1';
      iconSvg = `<polygon points="30,20 50,50 30,80" fill="none" stroke="#FF1744" stroke-width="3"/>`;
    } else {
      // Event default
      iconSvg = `
        <rect x="360" y="210" width="80" height="80" fill="#0B0D14" stroke="#0A84FF" stroke-width="2" transform="rotate(45 400 250)"/>
        <polyline points="390,250 400,240 410,250" fill="none" stroke="#FF1744" stroke-width="3"/>
      `;
    }

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#05060A"/>
            <stop offset="50%" stop-color="#0B0D14"/>
            <stop offset="100%" stop-color="#020305"/>
          </linearGradient>
          <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(10,132,255,0.06)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#bgGrad)"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>
        <rect x="1" y="1" width="${w - 2}" height="${h - 2}" fill="none" stroke="rgba(10,132,255,0.3)" stroke-width="1"/>
        ${iconSvg}
        <text x="50%" y="${h - 35}" fill="#8E9AA8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="2">
          ${safeLabel.toUpperCase()}
        </text>
        <text x="50%" y="${h - 18}" fill="rgba(255,255,255,0.25)" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle" letter-spacing="1">
          IMAGE ASSET PENDING [${ratio}]
        </text>
      </svg>
    `.trim().replace(/\s+/g, ' ');

    return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
  }

  /**
   * Image onError handler to prevent broken-image icons anywhere in the application.
   * @param {HTMLImageElement} img
   * @param {'event'|'profile'|'team'|'logo'} type
   * @param {string} label
   */
  function handleImageError(img, type = 'event', label = '') {
    if (!img) return;
    img.onerror = null; // Prevent infinite loop
    img.src = createFallbackSvg(type, label || img.alt || 'ALODANAX');
    img.classList.add('is-fallback-image');
  }

  /**
   * Diagnostic dev tool activated via ?audit=1.
   * Scans all loaded data objects and DOM for unfilled placeholders and missing assets.
   */
  function initAuditTool() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('audit') !== '1') return;

    const report = {
      site: [],
      events: [],
      committee: [],
      faculty: [],
      team: [],
      hackathon: [],
      faq: []
    };

    let totalPlaceholders = 0;
    let missingImages = 0;

    // Helper to recursively inspect objects
    function inspect(obj, fileKey, path = '') {
      if (!obj) return;
      if (typeof obj === 'string') {
        if (isPlaceholder(obj)) {
          report[fileKey].push({ path, value: obj, type: 'placeholder' });
          totalPlaceholders++;
        }
      } else if (Array.isArray(obj)) {
        obj.forEach((item, idx) => inspect(item, fileKey, `${path}[${idx}]`));
      } else if (typeof obj === 'object') {
        Object.keys(obj).forEach(k => inspect(obj[k], fileKey, path ? `${path}.${k}` : k));
      }
    }

    if (window.SITE_DATA) inspect(window.SITE_DATA, 'site');
    if (window.EVENTS_DATA) inspect(window.EVENTS_DATA, 'events');
    if (window.COMMITTEE_DATA) inspect(window.COMMITTEE_DATA, 'committee');
    if (window.FACULTY_DATA) inspect(window.FACULTY_DATA, 'faculty');
    if (window.TEAM_DATA) inspect(window.TEAM_DATA, 'team');
    if (window.HACKATHON_DATA) inspect(window.HACKATHON_DATA, 'hackathon');
    if (window.FAQ_DATA) inspect(window.FAQ_DATA, 'faq');

    // Count missing images on page
    document.querySelectorAll('img').forEach(img => {
      if (img.classList.contains('is-fallback-image') || !img.complete || img.naturalWidth === 0) {
        missingImages++;
      }
    });

    // Console output
    console.group(`%c✦ ALODANAX AUDIT SUITE (?audit=1) ✦`, 'color: #0A84FF; font-size: 14px; font-weight: bold;');
    console.log(`%cTotal Unfilled Placeholders: ${totalPlaceholders}`, 'color: #FF1744; font-weight: bold;');
    console.log(`%cPending / Fallback Image Elements: ${missingImages}`, 'color: #0A84FF;');

    Object.keys(report).forEach(fileKey => {
      const items = report[fileKey];
      if (items.length > 0) {
        console.groupCollapsed(`js/data/${fileKey}.js (${items.length} pending items)`);
        console.table(items);
        console.groupEnd();
      }
    });
    console.groupEnd();

    // Render floating Audit HUD Panel
    renderAuditHud(report, totalPlaceholders, missingImages);
  }

  function renderAuditHud(report, totalPlaceholders, missingImages) {
    let hud = document.getElementById('audit-hud');
    if (hud) hud.remove();

    hud = document.createElement('div');
    hud.id = 'audit-hud';
    hud.className = 'audit-hud-panel';

    let filesHtml = '';
    Object.keys(report).forEach(f => {
      const count = report[f].length;
      filesHtml += `
        <div class="audit-file-row">
          <span class="audit-file-name">js/data/${f}.js</span>
          <span class="audit-file-count ${count > 0 ? 'count-pending' : 'count-done'}">${count} pending</span>
        </div>
      `;
    });

    hud.innerHTML = `
      <div class="audit-hud-header">
        <div class="audit-title-wrap">
          <span class="audit-pulse-dot"></span>
          <strong>DEV AUDIT HUD</strong>
        </div>
        <button type="button" class="audit-close-btn" aria-label="Minimize Audit HUD" id="audit-toggle-btn">_</button>
      </div>
      <div class="audit-hud-body" id="audit-hud-body">
        <div class="audit-stat-strip">
          <div class="audit-stat-box">
            <span class="audit-stat-num">${totalPlaceholders}</span>
            <span class="audit-stat-lbl">PLACEHOLDERS</span>
          </div>
          <div class="audit-stat-box">
            <span class="audit-stat-num">${missingImages}</span>
            <span class="audit-stat-lbl">MISSING ASSETS</span>
          </div>
        </div>
        <div class="audit-files-list">
          ${filesHtml}
        </div>
        <div class="audit-footer-actions">
          <button type="button" class="btn-audit-copy" id="btn-copy-audit">COPY REPORT</button>
        </div>
      </div>
    `;

    document.body.appendChild(hud);

    const toggleBtn = document.getElementById('audit-toggle-btn');
    const hudBody = document.getElementById('audit-hud-body');
    if (toggleBtn && hudBody) {
      toggleBtn.addEventListener('click', () => {
        const isHidden = hudBody.style.display === 'none';
        hudBody.style.display = isHidden ? 'block' : 'none';
        toggleBtn.textContent = isHidden ? '_' : '+';
      });
    }

    const copyBtn = document.getElementById('btn-copy-audit');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const text = JSON.stringify(report, null, 2);
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = 'COPIED TO CLIPBOARD!';
          setTimeout(() => { copyBtn.textContent = 'COPY REPORT'; }, 2000);
        });
      });
    }
  }

  // Export to window.ALODANAX_UTILS
  window.ALODANAX_UTILS = {
    isPlaceholder,
    formatSafeText,
    formatSafeLink,
    getEventRegistrationUrl,
    renderRegistrationButton,
    verifyUniqueRegistrationUrls,
    createFallbackSvg,
    handleImageError,
    initAuditTool
  };

  // Run audit and duplicate URL verification on load
  function initSharedUtils() {
    if (window.EVENTS_DATA) {
      verifyUniqueRegistrationUrls(window.EVENTS_DATA);
    }
    initAuditTool();
  }
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSharedUtils);
    } else {
      initSharedUtils();
    }
  }

})(window);

    const panel = document.getElementById('drawer-panel');

    if (!header || !hamburgerBtn || !drawer) return;

    // Sticky transparent-to-solid on scroll
    window.addEventListener('scroll', () => {
      if (window.scrollY > 40) {
        header.classList.add('is-scrolled');
      } else {
        header.classList.remove('is-scrolled');
      }
    }, { passive: true });

    let previouslyFocusedElement = null;

    function openDrawer() {
      previouslyFocusedElement = document.activeElement;
      drawer.classList.add('is-open');
      drawer.setAttribute('aria-hidden', 'false');
      hamburgerBtn.setAttribute('aria-expanded', 'true');
      hamburgerBtn.setAttribute('aria-label', 'Close mobile navigation menu');
      document.body.style.overflow = 'hidden';

      // Set focus inside drawer
      if (closeBtn) closeBtn.focus();
      document.addEventListener('keydown', handleDrawerKeydown);
    }

    function closeDrawer() {
      drawer.classList.remove('is-open');
      drawer.setAttribute('aria-hidden', 'true');
      hamburgerBtn.setAttribute('aria-expanded', 'false');
      hamburgerBtn.setAttribute('aria-label', 'Open mobile navigation menu');
      document.body.style.overflow = '';

      document.removeEventListener('keydown', handleDrawerKeydown);
      if (previouslyFocusedElement && typeof previouslyFocusedElement.focus === 'function') {
        previouslyFocusedElement.focus();
      }
    }

    // Accessible Focus Trap inside Drawer
    function handleDrawerKeydown(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeDrawer();
        return;
      }

      if (e.key === 'Tab') {
        const focusable = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusable.length === 0) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }
    }

    hamburgerBtn.addEventListener('click', () => {
      const isOpen = drawer.classList.contains('is-open');
      if (isOpen) closeDrawer();
      else openDrawer();
    });

    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if (backdrop) backdrop.addEventListener('click', closeDrawer);

    // Close on any link click
    drawer.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', closeDrawer);
    });
  }

  /**
   * Injects the shared footer into #site-footer.
   */
  function renderFooter() {
    const container = document.getElementById('site-footer');
    if (!container) return;
    container.setAttribute('role', 'contentinfo');
    container.setAttribute('aria-label', 'Site Footer');

    const site = window.SITE_DATA || {};
    const brand = site.brand || { name: 'ALODANAX', edition: '2026', tagline: '[TAGLINE]' };
    const college = site.college || {};
    const contacts = site.contacts || {};
    const socials = site.socials || {};
    const utils = window.ALODANAX_UTILS || {};

    // Nav links in footer
    let quickLinksHtml = '';
    NAV_LINKS.forEach(l => {
      quickLinksHtml += `<li><a href="${l.href}">${l.label.toUpperCase()}</a></li>`;
    });

    // Social pills (rendered only if valid / not placeholder)
    let socialsHtml = '';
    const socialKeys = ['instagram', 'linkedin', 'github', 'youtube', 'x'];
    socialKeys.forEach(k => {
      const sVal = socials[k];
      if (sVal && !utils.isPlaceholder(sVal)) {
        socialsHtml += `<a href="${sVal}" target="_blank" rel="noopener noreferrer" class="social-pill" aria-label="${k.toUpperCase()}">${k.toUpperCase()}</a>`;
      }
    });

    // Safe contacts
    const phoneLink = utils.formatSafeLink ? utils.formatSafeLink('tel', contacts.phone) : null;
    const emailLink = utils.formatSafeLink ? utils.formatSafeLink('mailto', contacts.email) : null;

    const phoneDisplay = phoneLink
      ? `<a href="${phoneLink}" class="footer-link-active">${contacts.phone}</a>`
      : `<span class="footer-val-tba">${contacts.phone || '[PHONE TBA]'}</span>`;

    const emailDisplay = emailLink
      ? `<a href="${emailLink}" class="footer-link-active">${contacts.email}</a>`
      : `<span class="footer-val-tba">${contacts.email || '[EMAIL TBA]'}</span>`;

    container.innerHTML = `
      <div class="site-footer-inner">
        <div class="section-container">
          <div class="footer-grid">
            <!-- Brand & College Column -->
            <div class="footer-brand-column">
              <a href="index.html" class="footer-brand" aria-label="${brand.name} Home">${brand.name}</a>
              <p class="footer-department">${college.department || '[DEPARTMENT OF IT/CS]'}</p>
              <p class="footer-college-name">${college.name || '[COLLEGE NAME]'}</p>
              <p class="footer-tagline">${brand.tagline || ''}</p>
            </div>

            <!-- Quick Links -->
            <div class="footer-links-column">
              <h3 class="footer-col-title">NAVIGATION</h3>
              <ul class="footer-nav-list">
                ${quickLinksHtml}
              </ul>
            </div>

            <!-- Contacts & Venue -->
            <div class="footer-contact-column">
              <h3 class="footer-col-title">COORDINATION DESK</h3>
              <p class="footer-contact-line"><strong>EMAIL:</strong> ${emailDisplay}</p>
              <p class="footer-contact-line"><strong>PHONE:</strong> ${phoneDisplay}</p>
              <p class="footer-contact-line"><strong>VENUE:</strong> <span>${college.venue || '[VENUE TBA]'}</span></p>
              ${socialsHtml ? `<div class="footer-social-row">${socialsHtml}</div>` : ''}
            </div>
          </div>

          <!-- Bottom Bar -->
          <div class="footer-bottom-bar">
            <p class="footer-copyright">
              © ${brand.edition || '2026'} ${brand.name}. ${college.fullTitle || '[DEPARTMENT, COLLEGE]'}. ALL RIGHTS RESERVED.
            </p>
            <a href="#site-header" class="back-to-top" id="btn-back-to-top" aria-label="Back to top of page">
              <span>TOP</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </a>
          </div>
        </div>
      </div>
    `;

    const backToTop = document.getElementById('btn-back-to-top');
    if (backToTop) {
      backToTop.addEventListener('click', (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }

  /**
   * Helper to render common Subpage Hero (~45vh).
   * Black background, huge display type (solid + outline), breadcrumb, animated red-to-blue hairline sweep.
   * Respects prefers-reduced-motion.
   *
   * @param {string} containerId - Element ID to inject into
   * @param {object} options - { breadcrumb, titleSolid, titleOutline, subtitle }
   */
  function renderSubpageHero(containerId, options = {}) {
    const el = document.getElementById(containerId);
    if (!el) return;

    const breadcrumb = options.breadcrumb || 'HOME';
    const titleSolid = options.titleSolid || '';
    const titleOutline = options.titleOutline || '';
    const subtitle = options.subtitle || '';

    el.className = 'subpage-hero-section';
    el.setAttribute('role', 'region');
    el.setAttribute('aria-label', `${breadcrumb} Hero`);
    el.innerHTML = `
      <div class="subpage-hero-vignette" aria-hidden="true"></div>
      <div class="section-container subpage-hero-container">
        <nav class="subpage-breadcrumb" aria-label="Breadcrumb">
          <a href="index.html" class="breadcrumb-item">HOME</a>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-current" aria-current="page">${breadcrumb.toUpperCase()}</span>
        </nav>

        <h1 class="subpage-hero-title display-title">
          <span class="title-solid">${titleSolid}</span>
          <span class="title-outline">${titleOutline}</span>
        </h1>

        ${subtitle ? `<p class="subpage-hero-subtitle">${subtitle}</p>` : ''}
      </div>

      <!-- Animated Red-to-Blue Hairline Sweep (CSS only) -->
      <div class="hero-hairline-sweep-track" aria-hidden="true">
        <div class="hero-hairline-sweep-beam"></div>
      </div>
    `;
  }

  // Export to window.ALODANAX_COMPONENTS
  window.ALODANAX_COMPONENTS = {
    renderNavigation,
    renderFooter,
    renderSubpageHero
  };

  // Auto-render shared components on DOM ready
  function initSharedComponents() {
    renderNavigation();
    renderFooter();
  }
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSharedComponents);
    } else {
      initSharedComponents();
    }
  }

})(window);
/* ==== SHARED:COMPONENTS END ==== */
  </script>

  <!-- Page Application Script -->
  <script>
// ===== PAGE: TEAM.HTML SCRIPT =====
/**
 * ALODANAX TechFest - Student Team Page Controller
 * Handles 40 profile cards, dynamic department filter chips,
 * instant live search (name + role), safe social icon rendering, and image fallbacks.
 */

(function (window) {
  'use strict';

  let currentDept = 'all';
  let searchQuery = '';

  const searchInput = document.getElementById('team-search-input');
  const searchClearBtn = document.getElementById('team-search-clear');
  const chipsContainer = document.getElementById('team-department-chips');
  const statusBar = document.getElementById('team-status-bar');
  const cardsGrid = document.getElementById('team-cards-grid');
  const emptyState = document.getElementById('team-empty-state');
  const resetBtn = document.getElementById('btn-reset-team-filters');

  function init() {
    // 1. Render Subpage Hero
    if (window.ALODANAX_COMPONENTS && window.ALODANAX_COMPONENTS.renderSubpageHero) {
      window.ALODANAX_COMPONENTS.renderSubpageHero('team-hero', {
        breadcrumb: 'OUR TEAM',
        titleSolid: 'THE STUDENT',
        titleOutline: 'ENGINEERING CREW',
        subtitle: '40 dedicated student developers, infrastructure engineers, creative designers, and arena managers.'
      });
    }

    if (!window.TEAM_DATA) return;
    const allMembers = window.TEAM_DATA;
    const utils = window.ALODANAX_UTILS || {};

    // 2. Build Dynamic Department Filter Chips
    buildDynamicDepartmentChips(allMembers, utils);

    // 3. Render Cards
    renderTeamCards();

    // 4. Attach Listeners
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        if (searchClearBtn) {
          searchClearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        }
        renderTeamCards();
      });
    }

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', () => {
        if (searchInput) {
          searchInput.value = '';
          searchQuery = '';
          searchClearBtn.style.display = 'none';
          searchInput.focus();
        }
        renderTeamCards();
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        currentDept = 'all';
        searchQuery = '';
        if (searchInput) {
          searchInput.value = '';
          if (searchClearBtn) searchClearBtn.style.display = 'none';
        }
        updateChipsUI('all');
        renderTeamCards();
      });
    }
  }

  /**
   * Dynamically extracts unique non-placeholder departments to render filter chips.
   * If none are available, shows 'All' only.
   * @param {Array} members
   * @param {object} utils
   */
  function buildDynamicDepartmentChips(members, utils) {
    if (!chipsContainer) return;

    // Extract unique non-placeholder departments
    const rawDepts = members
      .map(m => m.department)
      .filter(d => d && typeof d === 'string' && !utils.isPlaceholder(d));

    const uniqueDepts = Array.from(new Set(rawDepts));

    let chipsHtml = `
      <button type="button" class="category-chip is-active" role="tab" aria-selected="true" data-dept="all">
        <span>ALL CREW (40)</span>
      </button>
    `;

    if (uniqueDepts.length > 0) {
      uniqueDepts.forEach(dept => {
        const count = members.filter(m => m.department === dept).length;
        chipsHtml += `
          <button type="button" class="category-chip" role="tab" aria-selected="false" data-dept="${dept}">
            <span>${dept.toUpperCase()} (${count})</span>
          </button>
        `;
      });
    }

    chipsContainer.innerHTML = chipsHtml;

    chipsContainer.querySelectorAll('.category-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const dept = btn.getAttribute('data-dept') || 'all';
        currentDept = dept;
        updateChipsUI(dept);
        renderTeamCards();
      });
    });
  }

  function updateChipsUI(selectedDept) {
    if (!chipsContainer) return;
    chipsContainer.querySelectorAll('.category-chip').forEach(btn => {
      const match = (btn.getAttribute('data-dept') === selectedDept);
      btn.classList.toggle('is-active', match);
      btn.setAttribute('aria-selected', match ? 'true' : 'false');
    });
  }

  /**
   * Filters and renders the 40 team cards.
   */
  function renderTeamCards() {
    if (!cardsGrid || !window.TEAM_DATA) return;
    const members = window.TEAM_DATA;
    const utils = window.ALODANAX_UTILS || {};

    const filtered = members.filter(m => {
      // Department match
      if (currentDept !== 'all' && m.department !== currentDept) {
        return false;
      }

      // Search match (name or role)
      if (!searchQuery) return true;
      const nameMatch = m.name && m.name.toLowerCase().includes(searchQuery);
      const roleMatch = m.role && m.role.toLowerCase().includes(searchQuery);
      const deptMatch = m.department && m.department.toLowerCase().includes(searchQuery);

      return nameMatch || roleMatch || deptMatch;
    });

    cardsGrid.innerHTML = '';

    if (filtered.length === 0) {
      if (emptyState) emptyState.style.display = 'block';
      if (statusBar) statusBar.textContent = '0 crew members match the search query.';
      return;
    }

    if (emptyState) emptyState.style.display = 'none';
    if (statusBar) {
      const deptLabel = currentDept === 'all' ? 'all departments' : `${currentDept} department`;
      statusBar.textContent = `Showing ${filtered.length} of ${members.length} student crew members in ${deptLabel}${searchQuery ? ` matching "${searchQuery}"` : ''}.`;
    }

    filtered.forEach(m => {
      const card = document.createElement('article');
      card.className = 'team-profile-card';

      // Social Links (rendered ONLY if link exists and is not placeholder)
      let socialsHtml = '';
      if (m.social) {
        if (m.social.linkedin && !utils.isPlaceholder(m.social.linkedin)) {
          socialsHtml += `
            <a href="${m.social.linkedin}" target="_blank" rel="noopener noreferrer" class="team-social-icon" aria-label="LinkedIn Profile">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
            </a>
          `;
        }
        if (m.social.github && !utils.isPlaceholder(m.social.github)) {
          socialsHtml += `
            <a href="${m.social.github}" target="_blank" rel="noopener noreferrer" class="team-social-icon" aria-label="GitHub Profile">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            </a>
          `;
        }
        if (m.social.instagram && !utils.isPlaceholder(m.social.instagram)) {
          socialsHtml += `
            <a href="${m.social.instagram}" target="_blank" rel="noopener noreferrer" class="team-social-icon" aria-label="Instagram Profile">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
          `;
        }
      }

      card.innerHTML = `
        <div class="team-photo-wrap">
          <img
            src="${m.photo || 'assets/images/team/member.jpg'}"
            alt="${m.name}"
            class="team-photo-img"
            loading="lazy"
            decoding="async"
            onerror="window.ALODANAX_UTILS && window.ALODANAX_UTILS.handleImageError(this, 'team', '${m.name}')"
          >
          <span class="team-dept-badge">${m.department || 'CREW'}</span>
        </div>
        <div class="team-card-content">
          <span class="team-role-title">${m.role}</span>
          <h3 class="team-member-name">${m.name}</h4>
          ${socialsHtml ? `<div class="team-socials-row">${socialsHtml}</div>` : ''}
        </div>
      `;

      cardsGrid.appendChild(card);
    });
  }

  // Initialize on DOM Ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})(window);
  </script>
