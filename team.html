<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team | ALODANAX 2026</title>
  <meta name="description" content="Meet the 40-member student organizing crew behind ALODANAX 2026 across technical systems, web infrastructure, design, logistics, and esports.">

  <!-- Open Graph -->
  <meta property="og:title" content="Our Team | ALODANAX 2026">
  <meta property="og:description" content="The dedicated student crew building and executing ALODANAX 2026.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Syne & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-team">

  <!-- Keyboard Accessibility: Skip Link -->
  <a href="#team-main" class="skip-link">Skip to main content</a>

  <!-- Shared Global Navigation (Injected by js/components.js) -->
  <div id="site-nav"></div>

  <!-- Common Subpage Hero (Injected by js/components.js) -->
  <section id="team-hero"></section>

  <!-- Main Content: Student Team Directory -->
  <main id="team-main" class="site-main team-portal-main">
    <div class="section-container">

      <!-- Interactive Toolbar: Name/Role Search + Dynamic Department Chips -->
      <div class="team-toolbar-wrap" role="region" aria-label="Search and filter team members">
        <!-- Search Input -->
        <div class="events-search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="team-search-input"
            class="events-search-input"
            placeholder="Search by student name or role..."
            aria-label="Search team members by name or role"
            autocomplete="off"
          >
          <button type="button" id="team-search-clear" class="search-clear-btn" aria-label="Clear search" style="display: none;">✕</button>
        </div>

        <!-- Dynamic Department Filter Chips -->
        <div class="team-chips-bar" id="team-department-chips" role="tablist" aria-label="Filter by department">
          <!-- Dynamically populated from unique non-placeholder departments in team.js -->
        </div>
      </div>

      <!-- Live Result Count & Status -->
      <div class="team-status-bar" id="team-status-bar" aria-live="polite">
        Showing all 40 student crew members
      </div>

      <!-- 40 Profile Cards Grid (1:1 Ratio) -->
      <div class="team-cards-grid" id="team-cards-grid">
        <!-- Populated from js/team-page.js -->
      </div>

      <!-- Empty State -->
      <div id="team-empty-state" class="events-empty-state" style="display: none;" role="status">
        <div class="empty-icon-box" aria-hidden="true">✦</div>
        <h3 class="empty-heading">NO CREW MEMBERS FOUND</h3>
        <p class="empty-subtext">No team members match your active search or department filter.</p>
        <button type="button" class="btn-cta btn-secondary-blue" id="btn-reset-team-filters">RESET FILTERS</button>
      </div>

    </div>
  </main>

  <!-- Shared Footer (Injected by js/components.js) -->
  <div id="site-footer"></div>

  <!-- Data Layer -->
  <script src="js/data/site.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/data/committee.js"></script>
  <script src="js/data/faculty.js"></script>
  <script src="js/data/team.js"></script>
  <script src="js/data/hackathon.js"></script>
  <script src="js/data/faq.js"></script>

  <!-- Core Utilities & Shared Components -->
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>

  <!-- Team Page Controller -->
  <script src="js/team-page.js"></script>
</body>
</html>
